version: 1
rules:
  - rule_id: ventas_bronze
    pipeline: ventas
    source_layer: bronze
    target_layer: bronze
    source_table: bronze.ventas
    target_table: bronze.ventas
    grain: [ticket_id]
    min_rows: 1
    max_drop_pct: 0.30
    load_date_column: fecha_carga
    severity: FAIL

  - rule_id: ventas_bronze_silver
    pipeline: ventas
    source_layer: bronze
    target_layer: silver
    source_table: bronze.ventas
    target_table: silver.ventas
    grain: [ticket_id]
    min_rows: 1
    min_ratio: 0.95
    max_ratio: 1.00
    max_drop_pct: 0.30
    load_date_column: fecha_carga
    severity: FAIL

  - rule_id: ventas_silver_gold
    pipeline: ventas
    source_layer: silver
    target_layer: gold
    source_table: silver.ventas
    target_table: gold.ventas_tienda_dia
    grain: [tienda_id, fecha_venta]
    min_rows: 1
    min_ratio: 0.98
    max_ratio: 1.02
    max_drop_pct: 0.30
    load_date_column: fecha_carga
    severity: FAIL
