cencosud_transformations:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  outputs:
    dev:
      type: glue
      role_arn: "{{ env_var('DBT_GLUE_ROLE_ARN') }}"
      region: "{{ env_var('AWS_REGION', 'us-east-2') }}"
      glue_version: "4.0"
      workers: "{{ env_var('DBT_GLUE_WORKERS', '2') | int }}"
      worker_type: "{{ env_var('DBT_GLUE_WORKER_TYPE', 'G.1X') }}"
      schema: silver
      location: "{{ env_var('DBT_GLUE_LOCATION') }}"
      datalake_formats: iceberg
      conf: >-
        spark.sql.extensions=org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
        --conf spark.sql.catalog.glue_catalog=org.apache.iceberg.spark.SparkCatalog
        --conf spark.sql.catalog.glue_catalog.catalog-impl=org.apache.iceberg.aws.glue.GlueCatalog
        --conf spark.sql.catalog.glue_catalog.io-impl=org.apache.iceberg.aws.s3.S3FileIO
        --conf spark.sql.catalog.glue_catalog.warehouse={{ env_var('DBT_GLUE_LOCATION') }}
        --conf spark.sql.catalog.spark_catalog=org.apache.iceberg.spark.SparkSessionCatalog
        --conf spark.sql.catalog.spark_catalog.catalog-impl=org.apache.iceberg.aws.glue.GlueCatalog
        --conf spark.sql.catalog.spark_catalog.io-impl=org.apache.iceberg.aws.s3.S3FileIO
        --conf spark.sql.catalog.spark_catalog.warehouse={{ env_var('DBT_GLUE_LOCATION') }}
      threads: 1
      glue_session_reuse: true
      glue_session_id: "cencosud-{{ env_var('RUN_ID', 'manual') }}"
      session_provisioning_timeout_in_seconds: 300
    prod:
      type: glue
      role_arn: "{{ env_var('DBT_GLUE_ROLE_ARN') }}"
      region: "{{ env_var('AWS_REGION', 'us-east-2') }}"
      glue_version: "4.0"
      workers: "{{ env_var('DBT_GLUE_WORKERS', '5') | int }}"
      worker_type: "{{ env_var('DBT_GLUE_WORKER_TYPE', 'G.1X') }}"
      schema: silver
      location: "{{ env_var('DBT_GLUE_LOCATION') }}"
      datalake_formats: iceberg
      conf: >-
        spark.sql.extensions=org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
        --conf spark.sql.catalog.glue_catalog=org.apache.iceberg.spark.SparkCatalog
        --conf spark.sql.catalog.glue_catalog.catalog-impl=org.apache.iceberg.aws.glue.GlueCatalog
        --conf spark.sql.catalog.glue_catalog.io-impl=org.apache.iceberg.aws.s3.S3FileIO
        --conf spark.sql.catalog.glue_catalog.warehouse={{ env_var('DBT_GLUE_LOCATION') }}
        --conf spark.sql.catalog.spark_catalog=org.apache.iceberg.spark.SparkSessionCatalog
        --conf spark.sql.catalog.spark_catalog.catalog-impl=org.apache.iceberg.aws.glue.GlueCatalog
        --conf spark.sql.catalog.spark_catalog.io-impl=org.apache.iceberg.aws.s3.S3FileIO
        --conf spark.sql.catalog.spark_catalog.warehouse={{ env_var('DBT_GLUE_LOCATION') }}
      threads: 1
      glue_session_reuse: true
      glue_session_id: "cencosud-{{ env_var('RUN_ID', 'manual') }}"
      session_provisioning_timeout_in_seconds: 600
